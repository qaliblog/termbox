name: Build

on:
  push:
    branches:
      - master
      - 'github-releases/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_variant: [ apt-android-7 ]

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Setup java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache TermBox assets
        uses: actions/cache@v4
        with:
          path: |
            build/termbox-assets
            app/src/main/assets/termbox-runtime
          key: termbox-assets-${{ runner.os }}-${{ hashFiles('termbox-assets/manifest.json') }}
          restore-keys: |
            termbox-assets-${{ runner.os }}-

      - name: Cache Box64 build
        uses: actions/cache@v4
        with:
          path: |
            build/termbox-assets/box64-source
            build/termbox-assets/build/box64
          key: box64-v0.4.4-${{ runner.os }}-android-ndk

      - name: Prepare TermBox assets
        shell: bash {0}
        run: |
          echo "========================================="
          echo "  TermBox Asset Preparation"
          echo "========================================="
          echo ""
          echo "Assets:"
          echo "  - proot-distro: downloading from GitHub"
          echo "  - Ubuntu 24.04: building from Docker OCI image"
          echo "  - Box64 v0.4.4: building from source with Android NDK"
          echo ""

          # Show Docker version for debugging
          docker --version
          echo ""

          # Show available NDK versions
          echo "Android NDK locations:"
          ls /usr/local/lib/android/sdk/ndk/ 2>/dev/null || echo "  (checking other locations)"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo ""
          # Show NDK sysroot headers for debugging
          NDK_DIR=$(ls /usr/local/lib/android/sdk/ndk/ 2>/dev/null | head -1)
          if [ -n "$NDK_DIR" ]; then
            echo "NDK version: $NDK_DIR"
            echo "Checking for posix_spawn.h in NDK:"
            find /usr/local/lib/android/sdk/ndk/$NDK_DIR -name 'spawn.h' 2>/dev/null | head -5
            echo "Checking for sem.h in NDK:"
            find /usr/local/lib/android/sdk/ndk/$NDK_DIR -name 'sem.h' 2>/dev/null | head -5
            echo "Checking for error.h in NDK:"
            find /usr/local/lib/android/sdk/ndk/$NDK_DIR -name 'error.h' 2>/dev/null | head -5
          fi
          echo ""

          # Run asset preparation (Box64 is REQUIRED - build fails if it cannot be produced)
          ./gradlew prepareTermBoxAssets --info

      - name: Verify TermBox assets
        shell: bash {0}
        run: |
          echo "========================================="
          echo "  TermBox Asset Verification"
          echo "========================================="
          echo ""

          ASSETS_DIR="app/src/main/assets/termbox-runtime"
          ERRORS=0

          # Check Bootstrap
          if [ -f "$ASSETS_DIR/bootstrap/aarch64.zip" ]; then
            echo "  Bootstrap:    PASS ($(du -h $ASSETS_DIR/bootstrap/aarch64.zip | cut -f1))"
          else
            echo "  Bootstrap:    FAIL (missing)"
            ERRORS=$((ERRORS + 1))
          fi

          # Check proot-distro
          if [ -d "$ASSETS_DIR/proot-distro" ]; then
            FILECOUNT=$(find $ASSETS_DIR/proot-distro -type f | wc -l)
            echo "  proot-distro: PASS ($FILECOUNT files)"
          else
            echo "  proot-distro: FAIL (missing)"
            ERRORS=$((ERRORS + 1))
          fi

          # Check Ubuntu rootfs
          if [ -f "$ASSETS_DIR/ubuntu/ubuntu-24.04-arm64.tar.xz" ]; then
            UBUNTU_SIZE=$(du -h $ASSETS_DIR/ubuntu/ubuntu-24.04-arm64.tar.xz | cut -f1)
            echo "  Ubuntu ARM64: PASS ($UBUNTU_SIZE)"
          else
            echo "  Ubuntu ARM64: FAIL (missing)"
            ERRORS=$((ERRORS + 1))
          fi

          # Check Box64
          if [ -f "$ASSETS_DIR/box64/box64" ]; then
            BOX64_SIZE=$(du -h $ASSETS_DIR/box64/box64 | cut -f1)
            BOX64_TYPE=$(file $ASSETS_DIR/box64/box64)
            BOX64_SHA256=$(sha256sum $ASSETS_DIR/box64/box64 | cut -d' ' -f1)
            echo "  Box64 ARM64:  PASS ($BOX64_SIZE)"
            echo "               Type: $BOX64_TYPE"
            echo "               SHA256: $BOX64_SHA256"

            # Verify it's actually ARM64, not x86_64
            if echo "$BOX64_TYPE" | grep -qi "aarch64\|ARM aarch64"; then
              echo "               Architecture: VERIFIED (AArch64)"
            else
              echo "  Box64 ARM64:  FAIL (wrong architecture!)"
              ERRORS=$((ERRORS + 1))
            fi
          else
            echo "  Box64 ARM64:  FAIL (missing)"
            ERRORS=$((ERRORS + 1))
          fi

          # Check Box64 ELF details
          if [ -f "$ASSETS_DIR/box64/box64" ] && command -v readelf &> /dev/null; then
            echo ""
            echo "  Box64 ELF details:"
            readelf -h $ASSETS_DIR/box64/box64 2>/dev/null | grep -E "Machine:|Class:|Type:|Entry point" || echo "  (readelf check failed)"
          fi

          echo ""
          echo "========================================="
          if [ $ERRORS -gt 0 ]; then
            echo "  RESULT: FAILED ($ERRORS error(s))"
            echo "========================================="
            exit 1
          else
            echo "  RESULT: ALL ASSETS VERIFIED"
            echo "========================================="
          fi

      - name: Build release APKs
        shell: bash {0}
        env:
          PACKAGE_VARIANT: ${{ matrix.package_variant }}
        run: |
          exit_on_error() { echo "$1"; exit 1; }

          echo "Setting vars"

          if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
              GITHUB_SHA="${{ github.event.pull_request.head.sha }}"
          fi

          # Set RELEASE_VERSION_NAME
          CURRENT_VERSION_NAME_REGEX='\s+versionName "([^"]+)"$'
          CURRENT_VERSION_NAME="$(grep -m 1 -E "$CURRENT_VERSION_NAME_REGEX" ./app/build.gradle | sed -r "s/$CURRENT_VERSION_NAME_REGEX/\1/")"
          RELEASE_VERSION_NAME="v$CURRENT_VERSION_NAME+${GITHUB_SHA:0:7}"
          if ! printf "%s" "${RELEASE_VERSION_NAME/v/}" | grep -qP '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'; then
           exit_on_error "The versionName '${RELEASE_VERSION_NAME/v/}' is not a valid semver."
          fi

          APK_DIR_PATH="./app/build/outputs/apk/release"
          APK_VERSION_TAG="$RELEASE_VERSION_NAME-${{ env.PACKAGE_VARIANT }}-github-release"
          APK_BASENAME_PREFIX="termbox_$APK_VERSION_TAG"

          echo "APK_DIR_PATH=$APK_DIR_PATH" >> $GITHUB_ENV
          echo "APK_VERSION_TAG=$APK_VERSION_TAG" >> $GITHUB_ENV
          echo "APK_BASENAME_PREFIX=$APK_BASENAME_PREFIX" >> $GITHUB_ENV

          echo "Building release APKs for '$APK_VERSION_TAG'"
          export TERMUX_APP_VERSION_NAME="${RELEASE_VERSION_NAME/v/}"
          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG"
          export TERMUX_PACKAGE_VARIANT="${{ env.PACKAGE_VARIANT }}"
          export TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS="1"

          if ! ./gradlew assembleRelease; then
            exit_on_error "Release build failed."
          fi

          echo "Built APKs:"
          ls -lh "$APK_DIR_PATH"/*.apk 2>/dev/null || exit_on_error "No APKs found in $APK_DIR_PATH"

          echo "Generating sha256sums"
          (cd "$APK_DIR_PATH" && sha256sum *.apk > "${APK_BASENAME_PREFIX}_sha256sums") || true

      - name: Upload APKs
        uses: actions/upload-artifact@v6
        with:
          name: termbox-release-${{ env.PACKAGE_VARIANT }}
          path: |
            ${{ env.APK_DIR_PATH }}/*.apk
            ${{ env.APK_DIR_PATH }}/output-metadata.json
          if-no-files-found: error
