name: Build

on:
  push:
    branches:
      - master
      - 'github-releases/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_variant: [ apt-android-7 ]

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Setup java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache TermBox assets
        uses: actions/cache@v4
        with:
          path: |
            build/termbox-assets
            app/src/main/assets/termbox-runtime
          key: termbox-assets-${{ runner.os }}-${{ hashFiles('termbox-assets/manifest.json') }}
          restore-keys: |
            termbox-assets-${{ runner.os }}-

      - name: Cache Box64 build
        uses: actions/cache@v4
        with:
          path: |
            build/termbox-assets/box64-source
            build/termbox-assets/build/box64
          key: box64-v0.4.4-${{ runner.os }}-android-ndk

      - name: Prepare TermBox assets
        shell: bash {0}
        run: |
          echo "Preparing TermBox offline runtime assets..."
          echo "  - proot-distro: downloading from GitHub"
          echo "  - Ubuntu 24.04: building from Docker OCI image"
          echo "  - Box64: building from source with Android NDK"

          # Show Docker version for debugging
          docker --version

          # Show available NDK versions
          echo "Android NDK locations:"
          ls /usr/local/lib/android/sdk/ndk/ 2>/dev/null || echo "  (checking other locations)"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          ./gradlew prepareTermBoxAssets --info 2>&1 | tail -50 || echo "Asset preparation completed with warnings (non-fatal)"

          # Show what was prepared
          echo ""
          echo "Prepared assets:"
          find app/src/main/assets/termbox-runtime -type f 2>/dev/null | head -20 || echo "  (none)"

      - name: Build release APKs
        shell: bash {0}
        env:
          PACKAGE_VARIANT: ${{ matrix.package_variant }}
        run: |
          exit_on_error() { echo "$1"; exit 1; }

          echo "Setting vars"

          if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
              GITHUB_SHA="${{ github.event.pull_request.head.sha }}"
          fi

          # Set RELEASE_VERSION_NAME
          CURRENT_VERSION_NAME_REGEX='\\s+versionName "([^"]+)"$'
          CURRENT_VERSION_NAME="$(grep -m 1 -E "$CURRENT_VERSION_NAME_REGEX" ./app/build.gradle | sed -r "s/$CURRENT_VERSION_NAME_REGEX/\\1/")"
          RELEASE_VERSION_NAME="v$CURRENT_VERSION_NAME+${GITHUB_SHA:0:7}"
          if ! printf "%s" "${RELEASE_VERSION_NAME/v/}" | grep -qP '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'; then
           exit_on_error "The versionName '${RELEASE_VERSION_NAME/v/}' is not a valid semver."
          fi

          APK_DIR_PATH="./app/build/outputs/apk/release"
          APK_VERSION_TAG="$RELEASE_VERSION_NAME-${{ env.PACKAGE_VARIANT }}-github-release"
          APK_BASENAME_PREFIX="termbox_$APK_VERSION_TAG"

          echo "APK_DIR_PATH=$APK_DIR_PATH" >> $GITHUB_ENV
          echo "APK_VERSION_TAG=$APK_VERSION_TAG" >> $GITHUB_ENV
          echo "APK_BASENAME_PREFIX=$APK_BASENAME_PREFIX" >> $GITHUB_ENV

          echo "Building release APKs for '$APK_VERSION_TAG'"
          export TERMUX_APP_VERSION_NAME="${RELEASE_VERSION_NAME/v/}"
          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG"
          export TERMUX_PACKAGE_VARIANT="${{ env.PACKAGE_VARIANT }}"
          export TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS="1"

          if ! ./gradlew assembleRelease; then
            exit_on_error "Release build failed."
          fi

          echo "Built APKs:"
          ls -lh "$APK_DIR_PATH"/*.apk 2>/dev/null || exit_on_error "No APKs found in $APK_DIR_PATH"

          echo "Generating sha256sums"
          (cd "$APK_DIR_PATH" && sha256sum *.apk > "${APK_BASENAME_PREFIX}_sha256sums") || true

      - name: Upload APKs
        uses: actions/upload-artifact@v6
        with:
          name: termbox-release-${{ env.PACKAGE_VARIANT }}
          path: |
            ${{ env.APK_DIR_PATH }}/*.apk
            ${{ env.APK_DIR_PATH }}/output-metadata.json
          if-no-files-found: error
