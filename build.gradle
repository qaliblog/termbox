buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.13.2"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

// TermBox offline mode property
ext {
    termboxOffline = project.hasProperty('termboxOffline') ? project.property('termboxOffline').toBoolean() : false
}
