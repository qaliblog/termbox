/**
 * TermBox Asset Preparation Build Script
 *
 * Downloads, builds, and prepares all runtime assets for the TermBox offline APK.
 *
 * Assets:
 *   - Bootstrap: Termux bootstrap packages (already built by downloadBootstraps in :app)
 *   - proot-distro: Termux proot-distro scripts
 *   - Ubuntu 24.04 ARM64: Extracted from official Docker OCI image
 *   - Box64: Prebuilt glibc ARM64 binary from ryanfortner/box64-debs (runs inside Ubuntu proot)
 *
 * Tasks:
 *   prepareTermBoxAssets - Download/build and prepare all assets for the APK
 *   cleanTermBoxAssets   - Remove downloaded and prepared assets
 *   termboxBuildSummary  - Print build status summary
 *
 * Usage:
 *   ./gradlew prepareTermBoxAssets
 *   ./gradlew assembleRelease (auto-runs prepareTermBoxAssets if assets exist)
 *   ./gradlew assembleRelease -PtermboxOffline=true
 *   ./gradlew cleanTermBoxAssets
 */

apply plugin: 'base'

import groovy.json.JsonSlurper
import java.security.MessageDigest
import java.security.DigestInputStream

// TermBox configuration
    ext {
    termboxOffline = project.hasProperty('termboxOffline') ? project.property('termboxOffline').toBoolean() : false
    provisionRootfs = project.hasProperty('provisionRootfs') ? project.property('provisionRootfs').toBoolean() : true

    // Asset directories
    termboxAssetsDir = new File(project.rootDir, 'termbox-assets')
    termboxCacheDir = new File(project.rootDir, 'build/termbox-assets')
    termboxDownloadsDir = new File(termboxCacheDir, 'downloads')
    termboxExtractedDir = new File(termboxCacheDir, 'extracted')
    termboxBuildDir = new File(termboxCacheDir, 'build')
    termboxManifestDir = new File(termboxCacheDir, 'manifest')

    // APK asset destination (inside app module)
    termboxApkAssetsDir = new File(project.rootDir, 'app/src/main/assets/termbox-runtime')


}

/**
 * Calculate SHA-256 hash of a file
 */
def calculateSha256(File file) {
    def digest = MessageDigest.getInstance("SHA-256")
    def buffer = new byte[8192]
    def input = new FileInputStream(file)
    def digestStream = new DigestInputStream(input, digest)
    while (digestStream.read(buffer) != -1) { /* read to calculate digest */ }
    digestStream.close()
    def hash = new BigInteger(1, digest.digest()).toString(16)
    while (hash.length() < 64) { hash = "0" + hash }
    return hash
}

/**
 * Download a file with optional SHA-256 verification and idempotent caching
 */
def downloadAsset(String name, String url, String expectedSha256, File destFile, boolean offline) {
    // Check if file already exists and is valid
    if (destFile.exists() && destFile.length() > 0) {
        if (expectedSha256 != null && !expectedSha256.isEmpty() && !expectedSha256.startsWith("PLACEHOLDER")) {
            def actualSha256 = calculateSha256(destFile)
            if (actualSha256 == expectedSha256) {
                logger.quiet("  [${name}] Asset already cached and verified: ${destFile.name}")
                return true
            } else {
                logger.quiet("  [${name}] Cached file has wrong hash, re-downloading...")
                destFile.delete()
            }
        } else {
            logger.quiet("  [${name}] Using existing file: ${destFile.name} (${destFile.length()} bytes)")
            return true
        }
    }

    // Check offline mode
    if (offline) {
        throw new GradleException("TermBox asset '${name}' missing and offline mode is enabled. " +
            "Place the asset at: ${destFile.absolutePath}")
    }

    // Download
    logger.quiet("  [${name}] Downloading from: ${url}")
    destFile.parentFile.mkdirs()

    // Download to .part file first (atomic download)
    def partFile = new File(destFile.parentFile, destFile.name + ".part")
    try {
        def connection = new URL(url).openConnection()
        connection.setInstanceFollowRedirects(true)
        connection.setConnectTimeout(30000)
        connection.setReadTimeout(120000)

        def out = new BufferedOutputStream(new FileOutputStream(partFile))
        if (expectedSha256 != null && !expectedSha256.isEmpty() && !expectedSha256.startsWith("PLACEHOLDER")) {
            def digest = MessageDigest.getInstance("SHA-256")
            def digestStream = new DigestInputStream(connection.inputStream, digest)
            out << digestStream
            out.close()

            def actualSha256 = new BigInteger(1, digest.digest()).toString(16)
            while (actualSha256.length() < 64) { actualSha256 = "0" + actualSha256 }

            if (actualSha256 != expectedSha256) {
                partFile.delete()
                throw new GradleException("  [${name}] SHA-256 mismatch!\n    Expected: ${expectedSha256}\n    Actual:   ${actualSha256}")
            }
        } else {
            out << connection.inputStream
            out.close()
        }

        // Rename .part to final file (atomic)
        if (destFile.exists()) destFile.delete()
        partFile.renameTo(destFile)
        logger.quiet("  [${name}] Downloaded: ${destFile.name} (${destFile.length()} bytes)")
        return true

    } catch (Exception e) {
        partFile.delete()
        throw new GradleException("  [${name}] Download failed: ${e.message}", e)
    }
}

/**
 * Execute a command and return success/failure
 */
def execCommand(String description, String... command) {
    logger.quiet("  [exec] ${description}")
    def process = command.execute()
    def stdout = new StringBuilder()
    def stderr = new StringBuilder()
    process.consumeProcessOutput(stdout, stderr)
    process.waitFor()
    if (process.exitValue() != 0) {
        logger.quiet("  [exec] Failed (exit code ${process.exitValue()}): ${stderr.toString().trim()}")
        return false
    }
    return true
}

/**
 * Create the prepareTermBoxAssets task
 */
task prepareTermBoxAssets {
    description = 'Downloads, builds, and prepares all TermBox runtime assets for offline APK packaging'
    group = 'TermBox'

    doLast {
        logger.quiet("\n========================================")
        logger.quiet("        TermBox Asset Preparation")
        logger.quiet("========================================\n")

        // Load manifest
        def manifestFile = new File(termboxAssetsDir, 'manifest.json')
        if (!manifestFile.exists()) {
            throw new GradleException("TermBox manifest not found at: ${manifestFile.absolutePath}")
        }
        def manifest = new JsonSlurper().parse(manifestFile)

        // Ensure directories exist
        termboxDownloadsDir.mkdirs()
        termboxExtractedDir.mkdirs()
        termboxBuildDir.mkdirs()
        termboxManifestDir.mkdirs()
        termboxApkAssetsDir.mkdirs()

        def assetsReady = 0
        def warnings = []

        // ========================================
        // 1. PROOT-DISTRO
        // ========================================
        logger.quiet("\n--- Preparing proot-distro ---")
        def prootDistro = manifest.'proot-distro'
        try {
            def prootDistroFile = new File(termboxDownloadsDir, prootDistro.filename)
            if (downloadAsset("proot-distro", prootDistro.url, prootDistro.sha256, prootDistroFile, termboxOffline)) {
                // Extract proot-distro source tree
                def extractDir = new File(termboxExtractedDir, 'proot-distro')
                if (!extractDir.exists()) {
                    extractDir.mkdirs()
                    def cmd = "tar -xzf ${prootDistroFile.absolutePath} -C ${extractDir.absolutePath} --strip-components=1"
                    if (!execCommand("Extract proot-distro", "sh", "-c", cmd)) {
                        throw new GradleException("Failed to extract proot-distro")
                    }
                }
                // Copy to APK assets
                def apkPdDir = new File(termboxApkAssetsDir, "proot-distro")
                apkPdDir.mkdirs()
                execCommand("Copy proot-distro to APK assets",
                    "sh", "-c", "cp -r ${extractDir.absolutePath}/. ${apkPdDir.absolutePath}/")
                logger.quiet("  [proot-distro] READY (v${prootDistro.version})")
                assetsReady++
            }
        } catch (Exception e) {
            logger.warn("  [proot-distro] Warning: ${e.message}")
            warnings << "proot-distro: ${e.message}"
        }

        // ========================================
        // 2. UBUNTU ARM64 ROOTFS (official ubuntu-base, direct download)
        // ========================================
        logger.quiet("\n--- Preparing Ubuntu 24.04 ARM64 Rootfs ---")
        def ubuntu = manifest.ubuntu
        def ubuntuTar = new File(termboxDownloadsDir, ubuntu.filename)

        try {
            if (downloadAsset("ubuntu", ubuntu.url, ubuntu.sha256, ubuntuTar, termboxOffline)) {
                def apkUbuntu = new File(termboxApkAssetsDir, "ubuntu/ubuntu-24.04-arm64.tar.gz")
                apkUbuntu.parentFile.mkdirs()

                if (provisionRootfs && !termboxOffline) {
                    // ---- PRE-PROVISIONED MODE ----
                    // Check if the existing APK assets tarball is already provisioned.
                    // A provisioned rootfs is significantly larger (~41MB) than the raw
                    // ubuntu-base (~29MB) and contains the /etc/termbox-provisioned marker.
                    boolean alreadyProvisioned = false
                    if (apkUbuntu.exists()) {
                        // Check for the marker inside the tarball
                        try {
                            def checkCmd = "tar -tzf ${apkUbuntu.absolutePath} 2>/dev/null | grep -c etc/termbox-provisioned"
                            def proc = ["sh", "-c", checkCmd].execute()
                            def output = new StringBuilder()
                            proc.consumeProcessOutput(output, new StringBuilder())
                            proc.waitFor()
                            if (proc.exitValue() == 0 && output.toString().trim().toInteger() > 0) {
                                alreadyProvisioned = true
                                logger.quiet("  [ubuntu] APK assets already contain a provisioned rootfs (${apkUbuntu.length() / (1024*1024)} MB) - skipping re-provisioning.")
                            }
                        } catch (Exception ignored) { /* not provisioned or can't read */ }
                    }

                    if (alreadyProvisioned) {
                        // Already provisioned - just use it as-is
                        assetsReady++
                    } else {
                    // Extract the ubuntu-base tarball, run apt-get install inside Docker
                    // with QEMU ARM64 emulation to pre-install systemd, dbus, ca-certificates,
                    // locales. The result is a fully provisioned rootfs that needs no online
                    // initialization at first launch.
                    // Graceful fallback: if Docker/QEMU is unavailable, fall back to standard mode.
                    boolean provisioned = false
                    try {
                        logger.quiet("  [ubuntu] Pre-provisioning rootfs (systemd, dbus, ca-certificates, locales)...")
                        def provisionStaging = new File(termboxBuildDir, 'ubuntu-provisioned-staging')
                        if (provisionStaging.exists()) provisionStaging.deleteDir()
                        provisionStaging.mkdirs()

                        // Extract ubuntu-base tarball
                        logger.quiet("  [ubuntu] Extracting ubuntu-base to staging...")
                        if (!execCommand("Extract ubuntu-base",
                            "sh", "-c", "tar -xzf ${ubuntuTar.absolutePath} -C ${provisionStaging.absolutePath}")) {
                            throw new GradleException("Failed to extract ubuntu-base tarball for provisioning")
                        }

                        // Run the provisioning script (Docker + QEMU ARM64 emulation)
                        def provisionScript = new File(termboxAssetsDir, 'prebuilt/provision-rootfs.sh')
                        if (!provisionScript.exists()) {
                            throw new GradleException("Provisioning script not found: ${provisionScript.absolutePath}")
                        }
                        def provisionCmd = "bash ${provisionScript.absolutePath} ${provisionStaging.absolutePath}"
                        logger.quiet("  [ubuntu] Running: ${provisionCmd}")
                        if (!execCommand("Pre-provision Ubuntu rootfs",
                            "sh", "-c", provisionCmd)) {
                            throw new GradleException("Rootfs provisioning failed (is Docker with QEMU ARM64 available?)")
                        }

                        // Re-tar the provisioned rootfs
                        logger.quiet("  [ubuntu] Re-tarring provisioned rootfs...")
                        def provisionedTar = new File(termboxBuildDir, 'ubuntu-24.04-arm64-provisioned.tar.gz')
                        if (provisionedTar.exists()) provisionedTar.delete()
                        if (!execCommand("Pack provisioned rootfs",
                            "sh", "-c", "tar -czf ${provisionedTar.absolutePath} --warning=failed-read -C ${provisionStaging.absolutePath} .")) {
                            throw new GradleException("Failed to re-tar provisioned rootfs")
                        }

                        // Copy provisioned tarball to APK assets
                        java.nio.file.Files.copy(provisionedTar.toPath(), apkUbuntu.toPath(),
                            java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                        logger.quiet("  [ubuntu] READY PRE-PROVISIONED (24.04 ARM64, ${apkUbuntu.length() / (1024*1024)} MB)")
                        logger.quiet("  [ubuntu] Packages: systemd, dbus, ca-certificates, locales (bundled in rootfs)")
                        provisioned = true
                        assetsReady++

                        // Clean up staging
                        provisionStaging.deleteDir()
                    } catch (Exception e) {
                        logger.warn("  [ubuntu] Pre-provisioning failed: ${e.message}")
                        logger.warn("  [ubuntu] Falling back to standard (un-provisioned) rootfs.")
                        logger.warn("  [ubuntu] To fix: install Docker + QEMU ARM64 (docker run --privileged --rm tonistiigi/binfmt --install all)")
                        warnings << "ubuntu pre-provisioning: ${e.message}"
                    }

                    if (!provisioned) {
                        // Fall back: copy raw ubuntu-base tarball to APK assets
                        if (!apkUbuntu.exists() || apkUbuntu.length() != ubuntuTar.length()) {
                            java.nio.file.Files.copy(ubuntuTar.toPath(), apkUbuntu.toPath(),
                                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                        }
                        logger.quiet("  [ubuntu] READY (24.04 ARM64, STANDARD MODE, ${ubuntuTar.length() / (1024*1024)} MB)")
                        assetsReady++
                    }
                    } // end !alreadyProvisioned
                } else {
                    // ---- STANDARD MODE (no pre-provisioning) ----
                    // Copy raw ubuntu-base tarball to APK assets.
                    // Provisioning (apt-get install) runs at first launch inside the device.
                    if (!apkUbuntu.exists() || apkUbuntu.length() != ubuntuTar.length()) {
                        java.nio.file.Files.copy(ubuntuTar.toPath(), apkUbuntu.toPath(),
                            java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                    }
                    logger.quiet("  [ubuntu] READY (24.04 ARM64, ${ubuntuTar.length() / (1024*1024)} MB)")
                    if (provisionRootfs && termboxOffline) {
                        logger.quiet("  [ubuntu] NOTE: -PprovisionRootfs=true ignored (offline mode)")
                    }
                    assetsReady++
                }
            }
        } catch (Exception e) {
            logger.warn("  [ubuntu] Warning: ${e.message}")
            warnings << "ubuntu: ${e.message}"
        }

        // ========================================
        // 2.5 PROOT (Termux proot binary + runtime libraries)
        // ========================================
        logger.quiet("\n--- Preparing proot ---")
        def proot = manifest.proot
        def prootDestDir = new File(termboxApkAssetsDir, "proot")

        try {
            // Extract all three .debs into one staging tree, then copy the files proot
            // needs into the APK assets under termbox-runtime/proot/{bin,libexec,lib}.
            def prootStaging = new File(termboxExtractedDir, 'proot')
            if (prootStaging.exists()) prootStaging.deleteDir()
            prootStaging.mkdirs()

            def allExtracted = true
            proot.packages.each { pkg ->
                def debFile = new File(termboxDownloadsDir, pkg.filename)
                if (!downloadAsset("proot-" + pkg.name, pkg.url, pkg.sha256, debFile, termboxOffline)) {
                    allExtracted = false
                    return
                }

                def pkgDir = new File(termboxExtractedDir, 'proot-' + pkg.name)
                if (pkgDir.exists()) pkgDir.deleteDir()
                pkgDir.mkdirs()

                if (!execCommand("Extract " + pkg.name + " .deb",
                    "sh", "-c", "ar -x ${debFile.absolutePath} --output=${pkgDir.absolutePath}")) {
                    throw new GradleException("Failed to extract " + pkg.name + " .deb")
                }

                def dataTar = new File(pkgDir, 'data.tar.xz')
                if (!dataTar.exists()) dataTar = new File(pkgDir, 'data.tar.zst')
                if (!dataTar.exists()) dataTar = new File(pkgDir, 'data.tar.gz')
                if (!dataTar.exists()) {
                    throw new GradleException("data.tar.* not found in " + pkg.name + " .deb. Contents: ${pkgDir.listFiles()?.collect { it.name }?.join(', ')}")
                }

                def dataDir = new File(pkgDir, 'data')
                dataDir.mkdirs()
                if (!execCommand("Extract " + pkg.name + " data archive",
                    "sh", "-c", "tar -xaf ${dataTar.absolutePath} -C ${dataDir.absolutePath}")) {
                    throw new GradleException("Failed to extract " + pkg.name + " data archive")
                }

                // Merge extracted tree into shared staging dir
                if (!execCommand("Merge " + pkg.name + " files",
                    "sh", "-c", "cp -r ${dataDir.absolutePath}/. ${prootStaging.absolutePath}/")) {
                    throw new GradleException("Failed to merge " + pkg.name + " files")
                }
            }

            if (allExtracted) {
                // Files are unpacked under data/data/com.termux/files/usr/...
                def usrDir = new File(prootStaging, 'data/data/com.termux/files/usr')
                if (!usrDir.exists()) {
                    throw new GradleException("Unexpected proot package layout: " + prootStaging.absolutePath)
                }

                def srcProot = new File(usrDir, 'bin/proot')
                if (!srcProot.exists()) {
                    throw new GradleException("proot binary not found in extracted .deb")
                }

                // Copy proot binary
                def destProot = new File(prootDestDir, 'bin/proot')
                destProot.parentFile.mkdirs()
                java.nio.file.Files.copy(srcProot.toPath(), destProot.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)

                // Copy loaders (statically linked, used by proot to run guest binaries)
                ['loader', 'loader32'].each { loaderName ->
                    def srcLoader = new File(usrDir, 'libexec/proot/' + loaderName)
                    if (srcLoader.exists()) {
                        def destLoader = new File(prootDestDir, 'libexec/' + loaderName)
                        destLoader.parentFile.mkdirs()
                        java.nio.file.Files.copy(srcLoader.toPath(), destLoader.toPath(),
                            java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                    }
                }

                // Copy runtime libraries into proot/lib. libtalloc.so.2 is the SONAME that
                // the proot binary links against, so the file must be stored under that name
                // (assets cannot carry symlinks reliably).
                def destLibDir = new File(prootDestDir, 'lib')
                destLibDir.mkdirs()
                def srcShmem = new File(usrDir, 'lib/libandroid-shmem.so')
                if (srcShmem.exists()) {
                    java.nio.file.Files.copy(srcShmem.toPath(), new File(destLibDir, 'libandroid-shmem.so').toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                }
                def srcTalloc = new File(usrDir, 'lib/libtalloc.so.2.4.3')
                if (srcTalloc.exists()) {
                    java.nio.file.Files.copy(srcTalloc.toPath(), new File(destLibDir, 'libtalloc.so.2').toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                }

                logger.quiet("  [proot] READY (v${proot.version}, ${destProot.length()} bytes)")
                assetsReady++
            }
        } catch (Exception e) {
            logger.warn("  [proot] Warning: ${e.message}")
            warnings << "proot: ${e.message}"
        }

        // ========================================
        // 3. BOX64 (prebuilt glibc ARM64 from ryanfortner/box64-debs)
        // ========================================
        logger.quiet("\n--- Preparing Box64 ---")
        def box64 = manifest.box64
        def box64Binary = new File(termboxApkAssetsDir, "box64/box64")

        try {
            // Prefer the committed patched box64 (termbox-assets/prebuilt/box64/box64):
            // built from ptitSeb/box64 with the MAP_FIXED fix (box64-mapfixed.patch) so
            // fixed-address (ET_EXEC) binaries like Bun-compiled opencode load correctly.
            // This is the source of truth for what ships in the APK. The download path
            // below only kicks in when the prebuilt binary is absent.
            def prebuiltBox64 = new File(termboxAssetsDir, 'prebuilt/box64/box64')
            if (prebuiltBox64.exists() && prebuiltBox64.length() > 0) {
                box64Binary.parentFile.mkdirs()
                java.nio.file.Files.copy(prebuiltBox64.toPath(), box64Binary.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                logger.quiet("  [box64] Using committed patched prebuilt binary (${box64Binary.length()} bytes)")
                assetsReady++
            } else if (box64Binary.exists() && box64Binary.length() > 0) {
                logger.quiet("  [box64] Using existing binary: ${box64Binary.name} (${box64Binary.length()} bytes)")
                assetsReady++
            } else if (termboxOffline) {
                throw new GradleException("Box64 binary missing and offline mode enabled")
            } else {
                // Download prebuilt Box64 .deb from ryanfortner/box64-debs
                // This is a glibc-linked ARM64 binary that runs inside the Ubuntu proot rootfs.
                logger.quiet("  [box64] Downloading prebuilt glibc Box64 from APT repo...")
                def debFile = new File(termboxDownloadsDir, box64.deb_filename)
                if (!downloadAsset("box64-deb", box64.deb_url, box64.deb_sha256, debFile, termboxOffline)) {
                    throw new GradleException("Failed to download Box64 .deb")
                }

                // Extract the .deb: it's an 'ar' archive containing data.tar.xz
                def extractDir = new File(termboxExtractedDir, 'box64-deb')
                if (extractDir.exists()) extractDir.deleteDir()
                extractDir.mkdirs()

                logger.quiet("  [box64] Extracting .deb archive...")
                // ar x to get data.tar.xz
                if (!execCommand("Extract .deb",
                    "sh", "-c", "ar -x ${debFile.absolutePath} --output=${extractDir.absolutePath}")) {
                    throw new GradleException("Failed to extract .deb (is 'ar' available?)")
                }

                def dataTar = new File(extractDir, 'data.tar.xz')
                if (!dataTar.exists()) {
                    // Some .debs use data.tar.zst or data.tar.gz
                    dataTar = new File(extractDir, 'data.tar.zst') ?: new File(extractDir, 'data.tar.gz')
                    if (!dataTar.exists()) {
                        throw new GradleException("data.tar.* not found in .deb. Contents: ${extractDir.listFiles()?.collect { it.name }?.join(', ')}")
                    }
                }

                logger.quiet("  [box64] Extracting data archive: ${dataTar.name}")
                def dataDir = new File(extractDir, 'data')
                dataDir.mkdirs()
                // Use --auto-compress to let tar detect the compression format
                if (!execCommand("Extract data archive",
                    "sh", "-c", "tar -xaf ${dataTar.absolutePath} -C ${dataDir.absolutePath}")) {
                    throw new GradleException("Failed to extract data archive")
                }

                // Find the box64 binary
                def binaryPath = box64.binary_path_in_deb ?: 'usr/local/bin/box64'
                def extractedBinary = new File(dataDir, binaryPath)
                if (!extractedBinary.exists()) {
                    // Search for it
                    def findResult = ["find", dataDir.absolutePath, "-name", "box64", "-type", "f"].execute()
                    def findOutput = new StringBuilder()
                    findResult.consumeProcessOutput(findOutput, new StringBuilder())
                    findResult.waitFor()
                    def found = findOutput.toString().trim().split('\n')
                    if (found.length > 0 && found[0]) {
                        extractedBinary = new File(found[0])
                    } else {
                        throw new GradleException("Box64 binary not found in extracted .deb")
                    }
                }
                logger.quiet("  [box64] Found binary: ${extractedBinary.absolutePath}")

                // Verify it's ARM64 glibc (NOT Bionic)
                def fileCmd = "file ${extractedBinary.absolutePath}"
                def fileProcess = fileCmd.execute()
                def fileOutput = new StringBuilder()
                fileProcess.consumeProcessOutput(fileOutput, new StringBuilder())
                fileProcess.waitFor()
                def fileType = fileOutput.toString().trim()
                logger.quiet("  [box64] Binary type: ${fileType}")

                if (!fileType.contains("aarch64") && !fileType.contains("ARM aarch64")) {
                    throw new GradleException("Box64 binary is not ARM64! Got: ${fileType}")
                }
                if (!fileType.contains("dynamically linked") || !fileType.contains("libc.so")) {
                    logger.quiet("  [box64] WARNING: Expected glibc-linked binary. Type: ${fileType}")
                }

                // Copy to APK assets
                box64Binary.parentFile.mkdirs()
                java.nio.file.Files.copy(extractedBinary.toPath(), box64Binary.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                logger.quiet("  [box64] READY (v${box64.version}, ARM64 glibc, ${box64Binary.length()} bytes)")
                assetsReady++
            }
        } catch (Exception e) {
            // Box64 is REQUIRED - fail the build if it cannot be built
            throw new GradleException("Box64 build FAILED (required for TermBox offline runtime): ${e.message}", e)
        }

        // ========================================
        // 3.5 BOX64 TRANSPARENT LAYER (ARM64 launcher used by termbox-wrap64)
        // ========================================
        logger.quiet("\n--- Preparing Box64 transparent layer ---")
        def box64Layer = manifest.'box64-layer'
        try {
            def srcLauncher = new File(termboxAssetsDir, 'prebuilt/box64/termbox-x86_64-launcher')
            def destLauncher = new File(termboxApkAssetsDir, 'box64/termbox-x86_64-launcher')
            if (srcLauncher.exists()) {
                destLauncher.parentFile.mkdirs()
                java.nio.file.Files.copy(srcLauncher.toPath(), destLauncher.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                logger.quiet("  [box64-layer] READY (launcher ${destLauncher.length()} bytes)")
                assetsReady++
            } else {
                throw new GradleException("termbox-x86_64-launcher not found at ${srcLauncher.absolutePath} " +
                    "- build it from termbox-assets/prebuilt/box64/termbox-x86_64-launcher.c with the NDK")
            }

            def srcScanner = new File(termboxAssetsDir, 'prebuilt/box64/termbox-scan64')
            def destScanner = new File(termboxApkAssetsDir, 'box64/termbox-scan64')
            if (srcScanner.exists()) {
                java.nio.file.Files.copy(srcScanner.toPath(), destScanner.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                logger.quiet("  [box64-layer] READY (scanner ${destScanner.length()} bytes)")
            } else {
                throw new GradleException("termbox-scan64 not found at ${srcScanner.absolutePath} " +
                    "- build it from termbox-assets/prebuilt/box64/termbox-scan64.c with the NDK")
            }

            def srcWrapd = new File(termboxAssetsDir, 'prebuilt/box64/termbox-wrapd')
            def destWrapd = new File(termboxApkAssetsDir, 'box64/termbox-wrapd')
            if (srcWrapd.exists()) {
                java.nio.file.Files.copy(srcWrapd.toPath(), destWrapd.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                logger.quiet("  [box64-layer] READY (watcher ${destWrapd.length()} bytes)")
            } else {
                throw new GradleException("termbox-wrapd not found at ${srcWrapd.absolutePath} " +
                    "- build it from termbox-assets/prebuilt/box64/termbox-wrapd.c with the NDK")
            }
        } catch (Exception e) {
            logger.warn("  [box64-layer] Warning: ${e.message}")
            warnings << "box64-layer: ${e.message}"
        }

        // The legacy LD_PRELOAD execve interposer (libbox64auto.so) is no longer
        // installed or injected: it only intercepted glibc execve/execv made through
        // public symbols, so JDK 17's ProcessBuilder (jspawnhelper -> execvp)
        // bypassed it and ARM64 processes were preloaded needlessly. The on-disk
        // launcher above cannot be bypassed. The .so stays in prebuilt/ only as
        // reference.

        // ========================================
        // 3.6 BOX64 X86_64 LIBS (glibc runtime for emulated binaries)
        // ========================================
        logger.quiet("\n--- Preparing Box64 x86_64 libraries ---")
        def box64Libs = manifest.'box64-libs'
        try {
            def staging = new File(termboxExtractedDir, 'box64-libs')
            if (staging.exists()) staging.deleteDir()
            staging.mkdirs()

            def allExtracted = true
            box64Libs.packages.each { pkg ->
                def debFile = new File(termboxDownloadsDir, pkg.filename)
                if (!downloadAsset("box64libs-" + pkg.name, pkg.url, pkg.sha256, debFile, termboxOffline)) {
                    allExtracted = false
                    return
                }
                def pkgDir = new File(termboxExtractedDir, 'box64libs-' + pkg.name)
                if (pkgDir.exists()) pkgDir.deleteDir()
                pkgDir.mkdirs()
                // dpkg-deb handles zstd/xz/gz data archives; available on Debian/Ubuntu builders
                // (including CI's ubuntu-latest).
                if (!execCommand("Extract " + pkg.name + " .deb",
                    "sh", "-c", "dpkg-deb -x ${debFile.absolutePath} ${pkgDir.absolutePath}")) {
                    throw new GradleException("Failed to extract " + pkg.name + " .deb with dpkg-deb")
                }
                if (!execCommand("Merge " + pkg.name + " files",
                    "sh", "-c", "cp -r ${pkgDir.absolutePath}/. ${staging.absolutePath}/")) {
                    throw new GradleException("Failed to merge " + pkg.name + " files")
                }
            }

            if (allExtracted) {
                def ldSrc = new File(staging, 'usr/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2')
                if (ldSrc.exists()) {
                    // Real file, not a symlink: assets cannot carry symlinks reliably.
                    // Staged at lib64/ld-linux-x86-64.so.2 (top-level) so the archive
                    // entry lands directly on the guest's /lib64/... path.
                    def ldReal = new File(staging, 'lib64/ld-linux-x86-64.so.2')
                    ldReal.parentFile.mkdirs()
                    java.nio.file.Files.copy(ldSrc.toPath(), ldReal.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                }

                def tarOut = new File(termboxApkAssetsDir, 'box64-libs/box64-libs.tar.gz')
                tarOut.parentFile.mkdirs()
                // Deterministic tar (fixed mtime/owner/sort order) so the archive
                // checksum is stable across builds and machines.
                // NOTE: entries live under usr/lib/x86_64-linux-gnu (NOT a top-level
                // lib/ entry): extracting a top-level lib/ directory would clobber the
                // guest's /lib -> usr/lib symlink and break every ARM64 binary in the
                // rootfs. The guest's /lib symlink resolves usr/lib/x86_64-linux-gnu.
                if (!execCommand("Pack box64-libs archive",
                    "sh", "-c", "tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -czf ${tarOut.absolutePath} -C ${staging.absolutePath} usr/lib/x86_64-linux-gnu lib64/ld-linux-x86-64.so.2")) {
                    throw new GradleException("Failed to pack box64-libs archive")
                }

                def expected = box64Libs.archive.sha256
                def actual = calculateSha256(tarOut)
                if (expected && expected != actual) {
                    logger.warn("  [box64-libs] SHA-256 mismatch (got ${actual}, expected ${expected})")
                    warnings << "box64-libs sha256 mismatch"
                } else {
                    logger.quiet("  [box64-libs] READY (${tarOut.length() / (1024*1024)} MB, sha256 ${actual.take(12)}...)")
                    assetsReady++
                }
            }
        } catch (Exception e) {
            logger.warn("  [box64-libs] Warning: ${e.message}")
            warnings << "box64-libs: ${e.message}"
        }

        // ========================================
        // 4. TERMBOX CONFIGURATION FILES
        // ========================================
        logger.quiet("\n--- Copying TermBox Configuration ---")
        def configSource = new File(termboxAssetsDir, 'config')
        def configDest = new File(termboxApkAssetsDir, 'config')
        configDest.mkdirs()
        if (configSource.exists()) {
            configSource.listFiles()?.each { file ->
                if (file.isFile()) {
                    java.nio.file.Files.copy(file.toPath(), new File(configDest, file.name).toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                }
            }
            logger.quiet("  [config] Configuration files copied")
        }

        // ========================================
        // 5. LICENSE FILE
        // ========================================
        def licenseSource = new File(project.rootDir, 'app/src/main/res/raw/termbox_licenses.txt')
        if (licenseSource.exists()) {
            def licenseDest = new File(termboxApkAssetsDir, 'LICENSES.txt')
            java.nio.file.Files.copy(licenseSource.toPath(), licenseDest.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            logger.quiet("  [licenses] License file copied")
        }

        // ========================================
        // WRITE RESOLVED MANIFEST
        // ========================================
        def resolvedManifest = [
            timestamp: new Date().format("yyyy-MM-dd'T'HH:mm:ss'Z'"),
            offline_mode: termboxOffline,
            assets_ready: assetsReady,
            warnings: warnings,
            manifest_hash: calculateSha256(manifestFile)
        ]
        new File(termboxManifestDir, 'resolved-assets.json').text =
            new groovy.json.JsonBuilder(resolvedManifest).toPrettyString()

        // ========================================
        // SUMMARY
        // ========================================
        logger.quiet("\n========================================")
        logger.quiet("    TermBox Asset Preparation Complete")
        logger.quiet("========================================")
        logger.quiet("  Offline mode: ${termboxOffline}")
        logger.quiet("  Assets ready: ${assetsReady}")
        logger.quiet("  Warnings: ${warnings.size()}")
        if (warnings) {
            warnings.each { logger.quiet("    - ${it}") }
        }
        logger.quiet("  Download dir: ${termboxDownloadsDir.absolutePath}")
        logger.quiet("  APK assets:   ${termboxApkAssetsDir.absolutePath}")
        logger.quiet("========================================\n")

        if (warnings && !warnings.isEmpty()) {
            logger.warn("\n  NOTE: Some optional assets could not be prepared.")
            logger.warn("  The APK will build but may be missing offline Ubuntu/Box64 support.\n")
        }
    }
}

/**
 * Create the cleanTermBoxAssets task
 */    task provisionUbuntuRootfs {
    description = 'Pre-installs systemd, dbus, ca-certificates, locales into the ubuntu-base rootfs using Docker+QEMU (requires Docker with ARM64 QEMU support)'
    group = 'TermBox'
    dependsOn prepareTermBoxAssets

    doLast {
        logger.quiet("\n========================================")
        logger.quiet("    Pre-provisioning Ubuntu Rootfs")
        logger.quiet("========================================\n")
        logger.quiet("This task has already run as part of prepareTermBoxAssets when")
        logger.quiet("-PprovisionRootfs=true was passed. To re-run provisioning:")
        logger.quiet("  ./gradlew prepareTermBoxAssets -PprovisionRootfs=true\n")
        logger.quiet("To build WITHOUT pre-provisioning (default):")
        logger.quiet("  ./gradlew prepareTermBoxAssets\n")
    }
}

    task cleanTermBoxAssets {
    description = 'Removes all downloaded and prepared TermBox assets (next build will re-download)'
    group = 'TermBox'

    doLast {
        logger.quiet("\n========================================")
        logger.quiet("    Cleaning TermBox Assets")
        logger.quiet("========================================\n")

        def dirs = [termboxCacheDir, termboxApkAssetsDir]
        dirs.each { dir ->
            if (dir.exists()) {
                logger.quiet("  Removing: ${dir.absolutePath}")
                dir.deleteDir()
            }
        }

        logger.quiet("\n  WARNING: The next build will need to download/rebuild all assets.")
        logger.quiet("  If you need to build offline, do NOT clean the assets.\n")
        logger.quiet("========================================\n")
    }
}

/**
 * Print build summary
 */
task termboxBuildSummary {
    description = 'Prints a summary of the TermBox build configuration'
    group = 'TermBox'

    doLast {
        def bootstrapReady = new File(termboxApkAssetsDir, "bootstrap/aarch64.zip").exists()
        def ubuntuReady = new File(termboxApkAssetsDir, "ubuntu/ubuntu-24.04-arm64.tar.gz").exists() ||
                          new File(termboxApkAssetsDir, "ubuntu/ubuntu-24.04-arm64.tar.xz").exists()
        def box64Ready = new File(termboxApkAssetsDir, "box64/box64").exists()
        def prootDistroReady = new File(termboxApkAssetsDir, "proot-distro/").exists()
        def provisionedUbuntu = false
        if (ubuntuReady) {
            // Check if the rootfs contains the provisioned marker
            def provisionedMarker = new File(termboxApkAssetsDir, "ubuntu/.termbox-provisioned")
            provisionedUbuntu = provisionedMarker.exists()
        }

        logger.quiet("\n========================================")
        logger.quiet("        TermBox Build Summary")
        logger.quiet("========================================\n")
        logger.quiet("Application:")
        logger.quiet("  Name: termbox")
        logger.quiet("  Package: com.qali.termbox\n")
        logger.quiet("Architecture:")
        logger.quiet("  Target: ARM64 / AArch64\n")
        logger.quiet("Offline Runtime:")
        logger.quiet("  Bootstrap:      ${bootstrapReady ? 'READY' : 'MISSING'}")
        logger.quiet("  proot-distro:   ${prootDistroReady ? 'READY' : 'MISSING'}")
        logger.quiet("  Ubuntu 24.04:   ${ubuntuReady ? (provisionedUbuntu ? 'READY (PRE-PROVISIONED)' : 'READY') : 'MISSING'}")
        logger.quiet("  Provisioned:   ${provisionedUbuntu ? 'YES (systemd/dbus/certs/locales bundled)' : 'NO (first-launch apt-get)'}")
        logger.quiet("  Box64:          ${box64Ready ? 'READY (glibc)' : 'MISSING'}")
        logger.quiet("  x86_64 fallback: ENABLED\n")

        def assetsDir = termboxDownloadsDir
        def totalSize = 0L
        if (assetsDir.exists()) {
            assetsDir.listFiles()?.each { totalSize += it.length() }
        }
        logger.quiet("Assets:")
        logger.quiet("  Cache size: ${totalSize / (1024 * 1024)} MB\n")

        def resolvedManifest = new File(termboxManifestDir, 'resolved-assets.json')
        if (resolvedManifest.exists()) {
            def manifest = new JsonSlurper().parse(resolvedManifest)
            logger.quiet("Last preparation:")
            logger.quiet("  Timestamp: ${manifest.timestamp}")
            logger.quiet("  Offline: ${manifest.offline_mode}")
        }

        logger.quiet("\n========================================\n")
    }
}
